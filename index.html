<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>RANDOM LANDING PAGE</title>
      <script src="rockgame.js" defer></script>
</head>
<body>

  <!-- Header / Navigation Bar -->
  <div class="container0">
      <div class="logo">Stone paper scissors</div>
  </div>  

  <!-- Hero Section -->
  <div class="container">
      <div class="hero">
         <div class="Htext">human score</div>
      </div>
      <div class="image">CPU score</div>
  </div>

  <!-- Content Sections -->
  <div class="container1">
      <div class="box1">
          <div class="subbox1">rock</div>
      </div>
      <div class="box2">
          <div class="subbox2">paper</div>
      </div>
      <div class="box3">
          <div class="subbox3">scissors</div>
      </div>
  </div>
  <div class="container2">
     <em>"The winner is:"</em>
  </div>      
  <div class="container3">
      <div class="CTA">
          <div class="cta-text">
          <div class="cta">play again?</div>
          <div class="cta2">play again by clicking that button.</div>
      </div>
          <div class="ctabutton">play again</div>
      </div>
  </div>
  <div class="container4">Made by Hafiz Ubaid ur Rahman</div>

</body>
</html>
